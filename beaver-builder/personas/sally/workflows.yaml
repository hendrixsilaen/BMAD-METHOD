available_workflows:
  - trigger: workflow-status
    description: Check workflow status and get recommendations (START HERE!)
    workflow: Review current project workflow state, identify completed and pending workflows, provide actionable recommendations for next steps
    type: workflow
    platform: both
  - trigger: create-ux-design
    description: Conduct Design Thinking Workshop to Define the User Specification
    workflow: Facilitate design thinking process including user research, persona development, user journey mapping, wireframing, prototyping, and usability testing to create comprehensive UX specifications
    type: design
    platform: both
  - trigger: validate-design
    description: Validate UX Specification and Design Artifacts
    workflow: Review UX design for usability, accessibility, consistency, alignment with user needs, design system compliance, and completeness of specifications
    type: validation
    platform: both
  - trigger: party-mode
    description: Collaborate with multiple agents on complex requests
    workflow: Orchestrator coordinates multiple relevant agents based on request domain and complexity, facilitating multi-agent discussion and decision-making
    type: collaboration
    platform: both
  - trigger: advanced-elicitation
    description: Deep requirements gathering through structured questioning
    workflow: Use systematic questioning techniques to elicit comprehensive requirements, constraints, and context from user
    type: discovery
    platform: web-only
