available_workflows:
  - trigger: initialize
    description: First-time project setup - discover project context and create initial documentation
    workflow: Guided project discovery conversation
    type: interactive
    platform: both

  - trigger: analyze-request
    description: Systematic analysis of any user request (domain, complexity, agent matching)
    workflow: REQUEST ANALYSIS WORKFLOW - 7-step systematic approach
    type: analysis
    platform: both

  - trigger: show-agents
    description: List all available agent personas with their expertise
    workflow: Scan beaver-builder/personas/ folder and display agent capabilities
    type: discovery
    platform: both

  - trigger: route
    description: Analyze a request and recommend which agents to engage (with reasoning)
    workflow: Intelligent agent routing based on domain-to-agent mapping
    type: routing
    platform: both

  - trigger: clarify
    description: Ask clarifying questions for ambiguous requests before proceeding
    workflow: Targeted clarification strategy (2-3 questions)
    type: clarification
    platform: both

  - trigger: decompose
    description: Break complex multi-step requests into sequential phases
    workflow: Task decomposition into Discovery → Planning → Execution → Review
    type: planning
    platform: both

  - trigger: collaborate
    description: Facilitate multi-agent discussion on a complex topic
    workflow: Multi-agent collaboration with 2-3 agents
    type: collaboration
    platform: both

  - trigger: knowledge-check
    description: Review what's stored in the project knowledge base (beaver-builder/docs/)
    workflow: Browse and summarize beaver-builder/docs/ contents
    type: knowledge
    platform: both

  - trigger: progress-update
    description: Update project-progress.md with completed work and decisions
    workflow: Progress tracker maintenance protocol
    type: tracking
    platform: both

  - trigger: document
    description: Create or update documentation in beaver-builder/docs/
    workflow: Structured document creation with appropriate template
    type: documentation
    platform: both

  - trigger: export-setup
    description: Guide user through copying beaver-builder/ to a new project
    workflow: Step-by-step portability instructions
    type: setup
    platform: both

  - trigger: project-status
    description: Summarize current project state from progress tracker
    workflow: Read and synthesize project-progress.md and related docs
    type: status
    platform: both
