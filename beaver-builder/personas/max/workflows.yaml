available_workflows:
  - trigger: sprint-planning
    description: Generate or update sprint-status.yaml from epic files
    workflow: Facilitate game development sprint planning by analyzing epics, creating sprint backlog, estimating story points, identifying dependencies, setting sprint goals, and generating sprint status tracking
    type: planning
    platform: both
  - trigger: epic-tech-context
    description: (Optional) Use the GDD and Architecture to create an Epic-Tech-Spec for a specific epic
    workflow: Develop epic-level technical context document synthesizing relevant Game Design Document sections, architecture decisions, technical constraints, and implementation approach for specific game development epic
    type: design
    platform: both
  - trigger: validate-epic-tech-context
    description: (Optional) Validate latest Tech Spec against checklist
    workflow: Review epic technical context for completeness, technical accuracy, alignment with game architecture and GDD, feasibility, and adherence to standards
    type: validation
    platform: both
  - trigger: create-story-draft
    description: Create a Story Draft for a game feature
    workflow: Develop game feature user story with clear description, gameplay acceptance criteria, technical considerations, asset dependencies, and estimation following story writing best practices
    type: planning
    platform: both
  - trigger: validate-create-story
    description: (Optional) Validate Story Draft with Independent Review
    workflow: Review game story for clarity, completeness, testability, appropriate scope, well-defined acceptance criteria, and adherence to INVEST principles
    type: validation
    platform: both
  - trigger: story-context
    description: (Optional) Assemble comprehensive story context from latest docs and code to prepare for development
    workflow: Generate comprehensive story context document gathering relevant game code, design documentation, architecture decisions, asset dependencies, and constraints to prepare story for development
    type: workflow
    platform: both
  - trigger: validate-story-context
    description: (Optional) Validate story context documentation against completeness checklist
    workflow: Review story context for completeness, accuracy, relevance, proper structure, and inclusion of all necessary game development information
    type: validation
    platform: both
  - trigger: story-ready-for-dev
    description: (Optional) Mark drafted story ready for dev without generating detailed context
    workflow: Verify game story meets readiness criteria (clear acceptance criteria, feasibility assessed, dependencies identified) and mark as ready for development
    type: workflow
    platform: both
  - trigger: epic-retrospective
    description: (Optional) Facilitate team retrospective after a game development epic is completed
    workflow: Conduct retrospective session reviewing what went well, what could be improved, gameplay insights, technical lessons learned, and action items from completed game epic
    type: collaboration
    platform: both
  - trigger: correct-course
    description: (Optional) Navigate significant changes during game dev sprint
    workflow: Analyze game development trajectory, identify deviations from design document, assess impacts on gameplay and technical roadmap, recommend corrective actions
    type: analysis
    platform: both
  - trigger: party-mode
    description: Collaborate with multiple agents on complex requests
    workflow: Orchestrator coordinates multiple relevant agents based on request domain and complexity, facilitating multi-agent discussion and decision-making
    type: collaboration
    platform: both
  - trigger: advanced-elicitation
    description: Deep requirements gathering through structured questioning
    workflow: Use systematic questioning techniques to elicit comprehensive requirements, constraints, and context from user
    type: discovery
    platform: both
