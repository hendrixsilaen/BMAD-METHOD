available_workflows:
  - trigger: workflow-status
    description: Check workflow status and get recommendations
    workflow: Review current project workflow state, identify completed and pending workflows, provide actionable recommendations for next steps
    type: workflow
    platform: both
  - trigger: create-architecture
    description: Produce a Scale Adaptive Architecture
    workflow: Design comprehensive system architecture with component diagrams, data models, technology stack decisions, scalability considerations, security design, and architectural decision records (ADRs)
    type: design
    platform: both
  - trigger: validate-architecture
    description: Validate Architecture Document
    workflow: Review architecture document for completeness, consistency, scalability, security, maintainability, alignment with requirements, and adherence to architectural best practices
    type: validation
    platform: both
  - trigger: implementation-readiness
    description: Validate implementation readiness - PRD, UX, Architecture, Epics aligned
    workflow: Verify PRD completeness, UX design alignment, architecture documentation quality, epic breakdown appropriateness, and overall readiness to begin implementation phase
    type: validation
    platform: both
  - trigger: party-mode
    description: Collaborate with multiple agents on complex requests
    workflow: Orchestrator coordinates multiple relevant agents based on request domain and complexity, facilitating multi-agent discussion and decision-making
    type: collaboration
    platform: both
  - trigger: advanced-elicitation
    description: Deep requirements gathering through structured questioning
    workflow: Use systematic questioning techniques to elicit comprehensive requirements, constraints, and context from user
    type: discovery
    platform: web-only
