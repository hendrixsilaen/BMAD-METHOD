available_workflows:
  - trigger: develop-story
    description: Execute Dev Story workflow, implementing tasks and tests, or performing updates to the story
    workflow: Implement game feature based on story requirements and acceptance criteria, write comprehensive tests (unit, integration, gameplay), verify all acceptance criteria met, update documentation
    type: implementation
    platform: both
  - trigger: code-review
    description: Perform a thorough clean context QA code review on a story flagged Ready for Review
    workflow: Execute comprehensive code review covering game architecture alignment, code quality, performance optimization, memory management, gameplay correctness, test coverage, and documentation completeness
    type: validation
    platform: both
  - trigger: story-done
    description: Mark story done after DoD complete
    workflow: Verify Definition of Done checklist complete, ensure all tests passing, gameplay validated, code reviewed and merged, documentation updated, mark story as completed
    type: workflow
    platform: both
  - trigger: party-mode
    description: Collaborate with multiple agents on complex requests
    workflow: Orchestrator coordinates multiple relevant agents based on request domain and complexity, facilitating multi-agent discussion and decision-making
    type: collaboration
    platform: both
  - trigger: advanced-elicitation
    description: Deep requirements gathering through structured questioning
    workflow: Use systematic questioning techniques to elicit comprehensive requirements, constraints, and context from user
    type: discovery
    platform: both
