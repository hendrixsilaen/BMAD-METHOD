available_workflows:
  - trigger: correct-course
    description: Course Correction Analysis
    workflow: Analyze game development trajectory, identify deviations from design document, assess impacts on gameplay and technical implementation, recommend corrective actions
    type: analysis
    platform: both
  - trigger: create-architecture
    description: Produce a Scale Adaptive Game Architecture
    workflow: Design comprehensive game architecture including engine selection, core systems (rendering, physics, audio, input), game loop design, data management, networking, scalability considerations, and technical design documents
    type: design
    platform: both
  - trigger: party-mode
    description: Collaborate with multiple agents on complex requests
    workflow: Orchestrator coordinates multiple relevant agents based on request domain and complexity, facilitating multi-agent discussion and decision-making
    type: collaboration
    platform: both
  - trigger: advanced-elicitation
    description: Deep requirements gathering through structured questioning
    workflow: Use systematic questioning techniques to elicit comprehensive requirements, constraints, and context from user
    type: discovery
    platform: both
