available_workflows:
  - trigger: brainstorm-game
    description: 1. Guide me through Game Brainstorming
    workflow: Facilitate structured game brainstorming session exploring game concepts, mechanics, genres, target audience, unique selling points, and market positioning
    type: discovery
    platform: both
  - trigger: create-game-brief
    description: 3. Create Game Brief
    workflow: Develop concise game brief including game vision, core mechanics, target platform, audience, art style, key features, success criteria, and development scope
    type: design
    platform: both
  - trigger: create-gdd
    description: 4. Create Game Design Document (GDD)
    workflow: Create comprehensive Game Design Document including gameplay mechanics, level design, progression systems, UI/UX specifications, narrative elements, technical requirements, and game balance considerations
    type: design
    platform: both
  - trigger: narrative
    description: 5. Create Narrative Design Document (story-driven games)
    workflow: Develop narrative design document including story overview, characters, world-building, dialogue systems, narrative structure, branching paths, and emotional beats for story-driven games
    type: design
    platform: both
  - trigger: party-mode
    description: Collaborate with multiple agents on complex requests
    workflow: Orchestrator coordinates multiple relevant agents based on request domain and complexity, facilitating multi-agent discussion and decision-making
    type: collaboration
    platform: both
  - trigger: advanced-elicitation
    description: Deep requirements gathering through structured questioning
    workflow: Use systematic questioning techniques to elicit comprehensive requirements, constraints, and context from user
    type: discovery
    platform: both
